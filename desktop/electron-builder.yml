appId: com.mathmover.desktop
productName: MathMover

directories:
  output: release
  # 默认是 build/，而 build/ 是运行时资产（几百 MB）。图标等打包资源单独放。
  buildResources: build-resources

copyright: Copyright © 2026 MathMover

# 安装包文件名不要带空格：latest.yml 里会写成连字符形式，带空格会导致更新请求 404。
artifactName: ${productName}-${version}-Setup.${ext}

win:
  icon: build-resources/icon.png

# Apple 芯片分发包；Node/OpenCode/Next 均在同架构 Mac runner 上构建。
mac:
  icon: build-resources/icon.png
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # 本地签名支持 Apple 芯片运行；尚无 Developer ID 和 Apple 公证。
  identity: '-'
  hardenedRuntime: false
  notarize: false
  minimumSystemVersion: '12.0'
  extraFiles:
    - from: node_modules/electron-sparkle-updater/native/vendor/Sparkle.framework
      to: Frameworks/Sparkle.framework
  extendInfo:
    SUFeedURL: https://github.com/Derek-yyang/mathmover/releases/latest/download/appcast-mac-arm64.xml
    SUPublicEDKey: wC2cZCdUS6dAEvz+TbILSYj27ksyZr82MMgD1Cl+4eo=
    SUEnableInstallerLauncherService: false
    SUVerifyUpdateBeforeExtraction: true
    SURequireSignedFeed: true
    SUScheduledCheckInterval: 14400
    SUDeltaChainHistory: 0

dmg:
  writeUpdateInfo: false
zip:
  writeUpdateInfo: false

nsis:
  # 安装器使用带下载标记的独立图标，和正式应用的绿色 M 区分。
  installerIcon: build-resources/installerIcon.ico
  # 辅助安装：允许用户自选安装目录；默认仍按当前用户安装，不需要管理员权限。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 手动安装时遵循安装选项页的勾选；自动更新不重建用户已删除的快捷方式。
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MathMover
  # 当前用户安装与桌面快捷方式选项（静默安装/自动更新跳过自定义页）
  include: build-resources/installer.nsh

# 自动更新的发布源。仓库公开后客户端可以匿名读 Releases。
# 发布用 `npx electron-builder --publish always`（需要 GH_TOKEN）；本地构建默认不传。
publish:
  provider: github
  owner: Derek-yyang
  repo: mathmover
  releaseType: release

# 壳本身只有主进程；其余全部走 extraResources（asar 里执行不了子进程与二进制）
files:
  - src/**/*
  - build-resources/icon.ico
  - build-resources/trayTemplate*.png
  - package.json
  - '!**/node_modules/electron-sparkle-updater/native/vendor/**'
  - '!**/node_modules/electron-sparkle-updater/native/sparkle-chain.tar.xz'
  - '!**/node_modules/electron-sparkle-updater/native/src/**'
  - '!**/node_modules/electron-sparkle-updater/native/build/!(Release)/**'

asarUnpack:
  - '**/node_modules/electron-sparkle-updater/native/build/Release/*.node'

extraResources:
  - from: ../LICENSE
    to: LICENSE
  - from: ../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: build/next
    to: next
  - from: build/next/node_modules
    to: next/node_modules
  - from: build/app
    to: app
  - from: build/node
    to: node
  - from: build/bin
    to: bin

asar: true
npmRebuild: false
afterPack: scripts/after-pack.cjs
