version: '3.8'

services:
  # 前端服务 (Next.js)。
  # 题目→构造现在由第三方 agent CLI 驱动，前端只与本机 daemon 通信
  # （MATHMOVER_DAEMON_URL，见 app/api/agent/route.ts）；原 Python 后端已随
  # 一次性生成管线一并下线，不再有 backend 服务。
  frontend:
    build:
      context: ./math-mover-next
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"

# 反向代理（Caddy）已随线上服务器停服退役（2026-10-08）。
# 本地调试需要访问前端时，给 frontend 加 ports: ["3000:3000"] 即可。
