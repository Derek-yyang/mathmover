version: '3.8'

services:
  # 后端服务 (Python Flask)
  # 模型配置来自根目录 config.json（随代码 COPY 进镜像，或用 volumes 挂载热更新）
  backend:
    build: .
    restart: always
    expose:
      - "5000"
    volumes:
      - ./config.json:/app/config.json

  # 前端服务 (Next.js)
  frontend:
    build:
      context: ./math-mover-next
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:5000
    depends_on:
      - backend

  # 反向代理服务 (Caddy)
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
