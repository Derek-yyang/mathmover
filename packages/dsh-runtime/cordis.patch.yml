# MathMover's stdio profile surface over the official dsh-base composition.
# The user's Harness installation owns credentials, settings, tools, sessions,
# and provider adapters. This bundle adds only the MathMover protocol boundary.

- id: system-prompt
  config:
    persona: >-
      You are a GeoGebra drawing assistant running for the MathMover workbench.
      You construct and revise dynamic geometry figures through the MathMover
      tools. Follow the complete task and project context supplied in the
      current user message.

- id: hmr
  disabled: true

- insert:
    - id: mathmover-startup
      name: '@mathmover/dsh-runtime/startup'

    - id: mathmover-runtime
      name: '@mathmover/dsh-runtime'
      inject: [mathmoverStartup]
