name: Desktop Release

# 打 v* tag 正式发布两平台；手动运行可选择正式发布或仅构建 Mac 测试包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: '两平台正式发布，或仅构建 macOS Apple 芯片测试包'
        type: choice
        default: release
        options:
          - release
          - macos

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'release'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: math-mover-next
        run: npm ci

      - name: Fetch vendored GeoGebra
        working-directory: math-mover-next
        run: npm run ggb:install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify platform and update checks
        run: node --test desktop/scripts/platform.test.cjs desktop/scripts/mac-updates.test.cjs desktop/scripts/sparkle-updates.test.cjs

      - name: Build Next standalone + daemon assets
        working-directory: desktop
        run: npm run prepare:assets

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # 不签名时不要尝试证书相关的探测
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test packaged workbench
        timeout-minutes: 5
        run: node desktop/scripts/verify.mjs

      - name: Verify bundled Agent with two mock conversation turns
        timeout-minutes: 5
        run: node desktop/scripts/verify-agent.mjs

      - name: Prepare stable Windows download name
        working-directory: desktop
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "release/MathMover-${VERSION}-Setup.exe" "release/MathMover-Setup.exe"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathmover-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # 免费公开分发：只做 ad-hoc 本地签名，不访问开发者证书。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: arm64
          cache: npm
      - name: Verify native Apple Silicon runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - name: Install workspace dependencies
        run: npm ci
      - name: Install frontend dependencies
        working-directory: math-mover-next
        run: npm ci
      - name: Fetch vendored GeoGebra
        working-directory: math-mover-next
        run: npm run ggb:install
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Verify platform selection and tray
        run: |
          node --test desktop/scripts/platform.test.cjs desktop/scripts/mac-updates.test.cjs desktop/scripts/sparkle-updates.test.cjs
          node desktop/scripts/make-mac-icons.mjs
          node desktop/scripts/verify-tray.cjs
      - name: Rebuild Sparkle for Electron arm64
        working-directory: desktop
        run: npm run prepare:updater
      - name: Verify signed update installation and tamper rejection
        timeout-minutes: 6
        run: node desktop/scripts/verify-sparkle.mjs
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Build Next standalone and native runtime assets
        working-directory: desktop
        run: npm run prepare:assets
      - name: Package Apple Silicon app
        working-directory: desktop
        run: npx electron-builder --mac --arm64 --publish never
      - name: Verify bundle architecture and signature
        run: node desktop/scripts/verify-mac-package.mjs
      - name: Sign Mac update archive and feed
        run: node desktop/scripts/sign-mac-update.mjs
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      - name: Smoke test packaged workbench
        timeout-minutes: 5
        run: node desktop/scripts/verify.mjs desktop/release/mac-arm64/MathMover.app/Contents/MacOS/MathMover
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Verify bundled Agent with two mock conversation turns
        timeout-minutes: 5
        run: node desktop/scripts/verify-agent.mjs desktop/release/mac-arm64/MathMover.app/Contents/MacOS/MathMover
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Prepare stable Mac download name
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          cp "desktop/release/MathMover-${VERSION}-mac-arm64.dmg" desktop/release/MathMover-mac-arm64.dmg
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: mathmover-macos-arm64
          retention-days: 7
          path: |
            desktop/release/*.dmg
            desktop/release/*-mac-arm64.zip
            desktop/release/appcast-mac-arm64.xml
          if-no-files-found: error
      - name: Upload smoke test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathmover-macos-diagnostics
          retention-days: 3
          path: |
            ${{ runner.temp }}/mm-desktop-*/shell*.png
            ${{ runner.temp }}/mm-agent-*/failure.png
            ${{ runner.temp }}/mm-desktop-*/MathMover/logs/*.log
            ${{ runner.temp }}/mm-agent-*/MathMover/logs/*.log
            ${{ runner.temp }}/mathmover-sparkle-test-*/native-output.log
            ${{ runner.temp }}/mathmover-sparkle-test-*/requests.json
            ${{ runner.temp }}/mathmover-sparkle-test-*/data/events.jsonl
          if-no-files-found: ignore

  # 两平台构建与 Mac 冒烟均通过后，集中上传到草稿，完整性检查通过才公开。
  publish:
    needs: [windows, macos]
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mathmover-windows
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: mathmover-macos-arm64
          path: installers
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag and desktop/package.json version must match' >&2
            exit 1
          fi
          for FILE in "MathMover-${VERSION}-Setup.exe" "MathMover-${VERSION}-Setup.exe.blockmap" \
            MathMover-Setup.exe latest.yml "MathMover-${VERSION}-mac-arm64.dmg" \
            "MathMover-${VERSION}-mac-arm64.zip" MathMover-mac-arm64.dmg appcast-mac-arm64.xml; do
            test -s "installers/$FILE"
          done
          if gh release view "$TAG" --json isDraft > /tmp/mathmover-release.json 2>/dev/null; then
            node -e "if (!require('/tmp/mathmover-release.json').isDraft) { console.error('Refusing to overwrite a published version; bump desktop/package.json'); process.exit(1); }"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$VERSION" --draft --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" installers/* --clobber
          gh release view "$TAG" --json assets > /tmp/mathmover-assets.json
          node -e "const a=require('/tmp/mathmover-assets.json').assets; for(const n of ['MathMover-Setup.exe','MathMover-mac-arm64.dmg','latest.yml','appcast-mac-arm64.xml']) if(!a.some(x=>x.name===n&&x.size>0)) process.exit(1)"
          gh release edit "$TAG" --draft=false --latest
