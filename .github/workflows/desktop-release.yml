name: Desktop Release

# 打 v* tag 触发；也可以在 Actions 页面手动跑（此时用 package.json 里的版本）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: math-mover-next
        run: npm ci

      - name: Fetch vendored GeoGebra
        working-directory: math-mover-next
        run: npm run ggb:install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Next standalone + daemon assets
        working-directory: desktop
        run: npm run prepare:assets

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # 不签名时不要尝试证书相关的探测
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 不用 electron-builder 的 GitHub publisher：它在首次发布时会并发上传并在
      # “release 不存在”上竞态，实测会创建出两个同 tag 的 Release（一个只有
      # blockmap、一个只有 exe）。改为自己建一个 Release，再三个文件一起传。
      - name: Publish GitHub Release
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$VERSION" --notes "MathMover $VERSION"
          gh release upload "$TAG" \
            "release/MathMover-${VERSION}-Setup.exe" \
            "release/MathMover-${VERSION}-Setup.exe.blockmap" \
            "release/latest.yml" --clobber

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathmover-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
