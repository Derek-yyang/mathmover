name: Desktop Release

# 打 v* tag 触发；也可以在 Actions 页面手动跑（此时用 package.json 里的版本）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Windows 正式发布，或 macOS Apple 芯片测试包（仅上传 Actions artifact）'
        type: choice
        default: windows
        options:
          - windows
          - macos

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: math-mover-next
        run: npm ci

      - name: Fetch vendored GeoGebra
        working-directory: math-mover-next
        run: npm run ggb:install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Next standalone + daemon assets
        working-directory: desktop
        run: npm run prepare:assets

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # 不签名时不要尝试证书相关的探测
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 不用 electron-builder 的 GitHub publisher：它在首次发布时会并发上传并在
      # “release 不存在”上竞态，实测会创建出两个同 tag 的 Release（一个只有
      # blockmap、一个只有 exe）。改为自己建一个 Release，再一起上传文件。
      - name: Publish GitHub Release
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # 官网用固定文件名下载最新版；保留版本化文件供自动更新使用。
          cp "release/MathMover-${VERSION}-Setup.exe" "release/MathMover-Setup.exe"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$VERSION" --notes "MathMover $VERSION"
          gh release upload "$TAG" \
            "release/MathMover-${VERSION}-Setup.exe" \
            "release/MathMover-${VERSION}-Setup.exe.blockmap" \
            "release/MathMover-Setup.exe" \
            "release/latest.yml" --clobber
          gh release edit "$TAG" --latest

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathmover-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  macos-test:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # 测试包只做 ad-hoc 本地签名，不访问开发者证书，不修改正式 Releases。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: arm64
          cache: npm
      - name: Verify native Apple Silicon runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - name: Install workspace dependencies
        run: npm ci
      - name: Install frontend dependencies
        working-directory: math-mover-next
        run: npm ci
      - name: Fetch vendored GeoGebra
        working-directory: math-mover-next
        run: npm run ggb:install
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Verify platform selection and tray
        run: |
          node --test desktop/scripts/platform.test.cjs
          node desktop/scripts/make-mac-icons.mjs
          node desktop/scripts/verify-tray.cjs
      - name: Build Next standalone and native runtime assets
        working-directory: desktop
        run: npm run prepare:assets
      - name: Package Apple Silicon test app
        working-directory: desktop
        run: npx electron-builder --mac --arm64 --publish never
      - name: Verify bundle architecture and signature
        run: node desktop/scripts/verify-mac-package.mjs
      - name: Smoke test packaged workbench
        run: node desktop/scripts/verify.mjs desktop/release/mac-arm64/MathMover.app/Contents/MacOS/MathMover
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Verify bundled Agent with two mock conversation turns
        run: node desktop/scripts/verify-agent.mjs desktop/release/mac-arm64/MathMover.app/Contents/MacOS/MathMover
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Upload macOS test installers
        uses: actions/upload-artifact@v4
        with:
          name: mathmover-macos-arm64-test
          retention-days: 7
          path: |
            desktop/release/*.dmg
            desktop/release/*-mac-arm64.zip
          if-no-files-found: error
      - name: Upload smoke test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathmover-macos-diagnostics
          retention-days: 3
          path: |
            ${{ runner.temp }}/mm-desktop-*/shell*.png
            ${{ runner.temp }}/mm-agent-*/failure.png
            ${{ runner.temp }}/mm-desktop-*/MathMover/logs/*.log
            ${{ runner.temp }}/mm-agent-*/MathMover/logs/*.log
          if-no-files-found: ignore
